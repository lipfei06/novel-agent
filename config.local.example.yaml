# 本地模型配置示例：复制为 config.yaml 后使用（或按需合并 llm 段）
# 支持 Ollama / LM Studio / vLLM / llama.cpp server 等一切 OpenAI 兼容服务
#
# 启动示例（Ollama）:
#   ollama pull qwen2.5:14b
#   ollama pull bge-m3          # 如需语义检索（embedding 模型）
#   ollama serve
#
# 建议模型：写作/规划档 ≥14B 且上下文 ≥32k（如 qwen2.5:14b、deepseek-r1:14b）；
#          cheap 档可用 7B（如 qwen2.5:7b）。上下文小于 32k 时务必同步调低 token_budget。

genre: e2e100k                        # 题材 profile 不变

llm:
  # base_url 指向本地服务；api_key_env 留空（本地无需密钥，工厂自动用占位符）
  creative: { model: "qwen2.5:14b", base_url: "http://127.0.0.1:11434/v1", api_key_env: "", temperature: 0.8, max_tokens: 8192 }
  writer:   { model: "qwen2.5:14b", base_url: "http://127.0.0.1:11434/v1", api_key_env: "", temperature: 0.9, max_tokens: 8192 }
  editor:   { model: "qwen2.5:14b", base_url: "http://127.0.0.1:11434/v1", api_key_env: "", temperature: 0.3, max_tokens: 4096 }
  cheap:    { model: "qwen2.5:7b",  base_url: "http://127.0.0.1:11434/v1", api_key_env: "", temperature: 0.7, max_tokens: 4096 }
  # LM Studio 示例: base_url: "http://127.0.0.1:1234/v1"
  # vLLM   示例: base_url: "http://127.0.0.1:8001/v1"

token_budget:                         # 本地模型上下文有限，按模型窗口调低（8k 窗口模型再减半）
  write: 24000
  edit: 6000
  check: 12000
  editorial: 12000
  export: 2000

memory:
  short_window: 2                     # 本地窗口小：全文窗口缩到 2 章，其余靠摘要
  full_window: 1
  vector:
    embedding:                        # 可选：本地 embedding（不配则回退内置 bigram 检索）
      model: "bge-m3"
      base_url: "http://127.0.0.1:11434/v1"
      api_key_env: ""                 # Ollama 通常不需要
      dim: 1024

rag: { top_k: 3 }                     # 本地上下文有限，召回条数同步收紧
