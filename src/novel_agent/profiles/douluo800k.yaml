id: douluo800k
name: 斗罗同人长篇（诸天·平民统一线）
target_word_count: 800000
default_volumes: 8
chapters_per_volume: 40
words_per_chapter: 2500
world_requirements:
  - 力量体系（魂力等级/魂环/魂技，含主角"无量白环"特设体系：魂力≈等级²、每级固定120天、只吸白环、魂技=固定消耗+最大魂力百分比效果、46级为翻盘拐点）
  - 势力格局（天斗帝国/星罗帝国/武魂殿三方 + 贵族门阀与底层平民的阶级生态）
  - 地理（边境城镇/星斗大森林/两大帝国腹地/武魂殿版图）
  - 时间线（与原作同期偏早约9年：主角6岁觉醒，21岁拐点=唐三入学史莱克同期，39岁破限后离站）
  - 平民社会生态（村庄/城镇/魂师体系外的普通人生活与困苦）
red_lines:
  - 违反平台合规的敏感内容
  - 不照搬原作正传情节，主干事件结果不改写
  - 原作角色保持原作性格与立场，不丑化、不抹黑
  - 正传神界线（成神事件）只作远端背景，不介入不改写
  - 政治变革限定架空世界观内，不影射现实
  - 不写 R18 内容
style_preset:
  tone: "稳健克制的热血：打脸用快节奏，算计戏降温，平民戏有现实质感"
  pace: "快节奏，每3章一个爽点循环（被辱→蓄力→翻盘）"
  dialogue_ratio: 0.4
  show_vs_tell: 0.65
  dialogue_life: "对话必须有杂音和性格差：不同人物不同话风（有人啰嗦跑题、有人带口头语、有人爱开玩笑、有人答非所问、有人抢话有人接话茬）；功能信息（设定/情报）拆碎了借闲聊说出，不许站桩念说明；每个对话场景至少一句『无用但鲜活』的闲话（吃的、钱、邻居、天气、抱怨）；叙述可以冷，人物嘴不能都冷。"
  dialogue_colloquial: "对话必须口语化：带语气词（呢/啊/呗/哩/咋/得了），允许重复、抢话、不完整的句子；禁止人物说书面语（如『从未见过这样』式的文绉绉台词只许有人设依据的角色用）；信息用『我跟你说』『你就记住一条』这类口语引导词带出来，数字和方位要说法随意（『东边三里，溪边上』而非『外围东边三里，坐标式报数』）。"
  hook_frequency: "每章结尾留钩子，每卷末强钩子"
  slice_of_life: "每卷设1-2个平民生活章（集市/年节/开学/丰收等），写柴米油盐的质感；生活章内必须藏一个成长确认或伏笔回收的暗爽点，不拖节奏"
  dialogue_life: "对话必须有杂音和性格差：不同人物不同话风（有人啰嗦跑题、有人带口头语、有人爱开玩笑、有人答非所问、有人抢话有人接话茬）；功能信息（设定/情报）拆碎了借闲聊说出，不许站桩念说明；每个对话场景至少一句『无用但鲜活』的闲话（吃的、钱、邻居、天气、抱怨）；叙述可以冷，人物嘴不能都冷。"
  climax_rhythm: "每3章一个爽点循环（被辱→蓄力→翻盘）；主角崛起后每隔2-3章安排一场小高潮；崛起节点（46级拐点、精英大赛、100级破限、统一）必有大高潮，铺垫要给足"
  storylines: "四线并行：L1变革线（明线主）·L2心结线（暗线）·L4原作互动线·L5生活线（质感）"
